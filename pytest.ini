[pytest]
# Four independently shippable objects (native / dhbind / hkbind / unify_netsdk).
# Each keeps its tests under its own tests/ dir -- see the tree in TODO 0.2.
# Listed explicitly: pytest rootdir inference misses empty dirs and would also
# wander into vendor/ (2.3 GB of read-only SDK packages).
testpaths =
    native/tests
    python/dhbind/tests
    python/hkbind/tests
    python/unify_netsdk/tests

markers =
    e2e: needs the out-of-project Dahua_NVR_Simulator; enable with "-m e2e"

# e2e is off by default -- not because it is slow, but because it spawns an
# external process and blocks ~20s during collection. A plain `pytest` run
# should not have that side effect.
addopts = -m "not e2e"