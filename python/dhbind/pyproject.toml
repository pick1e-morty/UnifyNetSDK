[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhbind"
version = "1.0.0"
description = "Dahua NetSDK thick binding: bundles the generated pyd + vendor DLLs, adds Client/LoginArgs/errors"
requires-python = ">=3.13"
# 核心零依赖。参数模型化是否引入 pydantic 是待定决策（TODO 0.6），
# 届时以 dhbind[pydantic] 可选依赖形式加，不在这里写死。
dependencies = []

[tool.setuptools]
packages = ["dhbind"]

[tool.setuptools.package-dir]
dhbind = "."

# _binding 里的 pyd / 厂商 DLL 是 wheel 的主体（tools/fill_binding.py 填充）
[tool.setuptools.package-data]
dhbind = ["_binding/*.pyd", "_binding/*.dll"]
